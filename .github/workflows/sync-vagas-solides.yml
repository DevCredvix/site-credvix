name: Atualizar vagas da Solides

on:
  workflow_dispatch:
  schedule:
    # A cada seis horas. Os horarios do GitHub Actions podem atrasar.
    - cron: '15 */6 * * *'

permissions:
  contents: write

concurrency:
  group: credvix-vagas-solides
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar navegador
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Testar extrator e regras de seguranca
        run: python -m unittest discover -s scripts -p test_sync_solides.py
      - name: Consultar a listagem oficial e validar os links
        run: python scripts/sync_solides.py
      - name: Diagnostico se falhar a coleta
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-solides-listagem
          path: scripts/debug-solides.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Publicar manifesto (apenas se a sincronizacao foi bem-sucedida)
        run: |
          if git diff --quiet -- public/vagas-solides.json; then
            echo 'Nenhuma alteracao no manifesto.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/vagas-solides.json
          git commit -m 'chore: atualizar vagas verificadas na Solides'
          git push origin HEAD:master
